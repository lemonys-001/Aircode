[package]
name = "ai-coding-agent"
version = "2.2.3"
edition = "2021"
description = "AirCode — Pure-Rust native desktop AI coding agent (zero WebView)"
authors = ["Aircode Contributors"]

[[bin]]
name = "aircode"
path = "src/main.rs"

[lib]
name = "ai_coding_agent"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
