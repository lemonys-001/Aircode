[package]
name = "ai-coding-agent-setup"
version = "2.2.3"
edition = "2021"
description = "AirCode — Pure-Rust Windows x64 setup wizard & uninstaller"
build = "build.rs"

[[bin]]
name = "aircode-setup"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
