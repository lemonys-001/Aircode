[package]
name = "ai-coding-agent-setup"
version = "2.0.0"
edition = "2021"
description = "Pure-Rust Native Windows x64 Setup Wizard & Uninstaller for AI Coding Agent"
build = "build.rs"

[[bin]]
name = "AI-Coding-Agent-Setup"
